    '<circle class="ring-fg" cx="78" cy="78" r="66" fill="none" stroke-width="11" stroke-dasharray="' + circumference.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"/>' +
    '</svg><div class="ring-center"><b>' + cov + "%</b><span>cobertura</span></div></div>" +
    '<div class="ring-caption"><b style="color:#f8fafc">' + doneLessons + " de " + TOPICS.length + "</b> aulas concluídas<br><span style=\"color:#94a3b8\">" + QUESTIONS.length + " questões · " + CARDS.length + " flashcards</span></div></div>";

  const focusHtml = focus
    ? '<div class="card"><div class="card-head"><div><h3>Foco agora' + (ms < 36 * 3600000 ? " · reta final" : "") + '</h3><p>' + (focus.start <= nowMs() && focus.end > nowMs() ? "Bloco em andamento" : "Próximo bloco pendente") + "</p></div><span class=\"badge " + (focus.type === "sim" ? "red" : focus.type === "cycle" ? "lime" : "blue") + '">' + fmtTime(focus.start) + "–" + fmtTime(focus.end) + "</span></div>" +
      '<div style="font-weight:700;font-size:15px;letter-spacing:-.02em">' + esc(focus.title) + "</div>" +
      '<p class="small muted mt-8">' + esc(focus.desc) + "</p>" +
      '<div class="row mt-16">' + blockAction(focus, "primary") + '<a class="btn" href="#/plano">Ver plano completo ' + icon("arrow", "") + "</a></div></div>"
    : '<div class="card"><div class="card-head"><div><h3>Foco agora</h3><p>Sem bloco pendente</p></div><span class="badge green">Em dia</span></div>' +
      "<p class=\"small muted\">Ou a prova é hoje, ou você concluiu o plano. Vá para o checklist do dia ou revise flashcards.</p>" +
      '<div class="row mt-16"><a class="btn primary" href="#/flashcards">Revisar flashcards</a><a class="btn" href="#/plano">Checklist</a></div></div>';

  const pomo = ui.pomo;
  const pomoMin = Math.floor(pomo.seconds / 60), pomoSec = pomo.seconds % 60;
  const pomoHtml = '<div class="card"><div class="card-head"><div><h3>Pomodoro</h3><p>25 min de foco, 5 de pausa</p></div><span class="badge outline">' + (state.pomodoro.sessions || 0) + " sessões</span></div>" +
    '<div class="pomodoro"><div class="pomo-time" id="pomo-time">' + pad2(pomoMin) + ":" + pad2(pomoSec) + "</div>" +
    '<div class="pomo-actions">' + (pomo.running
      ? '<button class="btn" data-action="pomo-pause">' + icon("pause", "") + "Pausar</button>"
      : '<button class="btn primary" data-action="pomo-start">' + icon("play", "") + "Iniciar</button>") +
    '<button class="btn ghost" data-action="pomo-reset" aria-label="Reiniciar">' + icon("rotate", "") + "</button></div></div>" +
    '<div class="pomo-label mt-12">' + (pomo.running ? "Foco em andamento" : "Pronto para começar") + "</div></div>";

  const hot = TOPICS.filter((t) => t.temp === "hot").slice(0, 5);
  const priorityRows = hot.map((t) => {
    const s = topicStats(t.id);
    const area = AREA_BY_ID[t.area];
    const done = lessonDone(t.id);
    return '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line);gap:10px">' +
      '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(t.title) + '</div>' +
      '<div class="tiny muted">' + area.short + " · " + (s.accuracy == null ? "Sem diagnóstico (0 tentativas)" : Math.round(s.accuracy * 100) + "% em " + s.attempts + " tentativas") + "</div></div>" +
      (done ? '<span class="badge green">Aula ok</span>' : '<span class="badge ' + TEMP_CLASS[t.temp] + '">' + TEMP_LABEL[t.temp] + "</span>") +
      '<button class="btn sm" data-action="open-lesson" data-topic="' + t.id + '">Abrir</button></div>';
  }).join("");

  const arch =
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>Componente</th><th class="num">Itens</th><th class="num">Valor</th><th>Corte / regra</th><th class="num">Meta 90%</th></tr></thead><tbody>' +
    "<tr><td class=\"strong\">Prova objetiva</td><td class=\"num\">40</td><td class=\"num\">100,0 pts</td><td>≥ 50,0 e ≥ 1 acerto por área</td><td class=\"num\">90,0 (36/40)</td></tr>" +
    "<tr><td class=\"strong\">Caso clínico</td><td class=\"num\">1</td><td class=\"num\">10,0 pts</td><td>≥ 5,0 na rubrica</td><td class=\"num\">9,0</td></tr>" +
    "<tr><td class=\"strong\">Global</td><td class=\"num\">—</td><td class=\"num\">110,0 pts</td><td>Objetiva + caso</td><td class=\"num\">99,0</td></tr>" +
    "</tbody></table></div>";

  const ap2Html = AP2_MODULES.length ? '<div class="card mt-16"><div class="card-head"><div><h3>AP2 2026.2 — trilha específica</h3><p>' + ap2.modules + ' módulos · ' + ap2.total + ' questões históricas · gabarito antigo + atualização 2026</p></div><a class="badge purple" href="#/ap2">Abrir trilha</a></div>' +
    '<div class="grid grid-2 mt-8">' + AP2_MODULES.map((m) => {
      const st = ap2ModuleStats(m.id);
      return '<div class="ap2-mini"><div class="row" style="gap:8px;align-items:center"><span class="badge purple">' + m.code + '</span><b class="small" style="flex:1;min-width:0">' + esc(m.title) + '</b>' + (st.lesson ? '<span class="badge green">Aula ok</span>' : "") + '</div>' +
        '<div class="tiny muted mt-8">' + st.answered + "/" + st.total + " questões · " + (st.accuracy == null ? "sem diagnóstico" : Math.round(st.accuracy * 100) + "% acerto") + '</div>' +
        '<div class="progress sm mt-8"><i style="width:' + (st.total ? Math.round((st.answered / st.total) * 100) : 0) + '%"></i></div></div>';
    }).join("") + "</div>" +
    '<div class="row mt-12"><span class="small muted">' + ap2.lessonsDone + " de " + ap2.modules + " aulas AP2 concluídas · " + (ap2.accuracy == null ? "sem tentativas no bloco" : "acurácia " + Math.round(ap2.accuracy * 100) + "%") + '</span><span class="spacer"></span><a class="btn sm" href="#/ap2">Ver módulos e fontes ' + icon("arrow", "") + "</a></div></div>" : "";

  return pageHead("Olá" + (state.settings.name ? ", " + esc(state.settings.name.split(" ")[0]) : "") + ".", "Seu painel de reta final em urologia — dados reais, prioridades explícitas e nenhuma promessa de adivinhação.", "") +
    '<div class="hero"><div><div class="eyebrow">Reta final · ' + (ms > 0 ? fmtCountdown(ms) + " até a prova" : "prova encerrada") + "</div>" +
    "<h1>" + headline + "</h1><p>" + sub + "</p>" +
    '<div class="hero-stats"><div class="hero-stat"><b>' + TOPICS.length + '</b><span>tópicos</span></div><div class="hero-stat"><b>' + QUESTIONS.length + '</b><span>questões</span></div><div class="hero-stat"><b>' + CARDS.length + '</b><span>flashcards</span></div><div class="hero-stat"><b class="accent">' + (st.attempts ? Math.round(st.accuracy * 100) + "%" : "—") + '</b><span>acurácia real</span></div></div></div>' + ring + "</div>" +

    '<div class="grid grid-kpi mt-16">' +
    '<div class="card kpi"><div class="kpi-top"><div class="kpi-ico blue">' + icon("clock", "") + '</div><span class="kpi-label">Tempo até a prova</span></div><div class="kpi-value">' + fmtCountdown(ms) + '</div><div class="kpi-foot">' + (isNaN(exam.getTime()) ? "Data inválida" : fmtDateLong(exam.getTime()) + " · " + fmtTime(exam.getTime())) + "</div></div>" +
    '<div class="card kpi"><div class="kpi-top"><div class="kpi-ico lime">' + icon("help", "") + '</div><span class="kpi-label">Questões respondidas</span></div><div class="kpi-value">' + st.answered + "<small>/" + QUESTIONS.length + '</small></div><div class="kpi-foot ' + (st.attempts ? "good" : "") + '">' + (st.attempts ? "Acurácia " + Math.round(st.accuracy * 100) + "% em " + st.attempts + " tentativas" : "Sem diagnóstico (0 tentativas)") + "</div></div>" +
    '<div class="card kpi"><div class="kpi-top"><div class="kpi-ico green">' + icon("book", "") + '</div><span class="kpi-label">Aulas concluídas</span></div><div class="kpi-value">' + doneLessons + "<small>/" + TOPICS.length + '</small></div><div class="kpi-foot"><div class="progress sm mt-8"><i style="width:' + cov + '%"></i></div></div></div>' +
    '<div class="card kpi"><div class="kpi-top"><div class="kpi-ico amber">' + icon("layers", "") + '</div><span class="kpi-label">Flashcards vencidos</span></div><div class="kpi-value">' + due + '</div><div class="kpi-foot ' + (due > 15 ? "warn" : "") + '">' + newc + " novos · " + matureCards().length + " maduros</div></div></div>" +

    '<div class="grid grid-3 mt-16" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.85fr)">' +
    focusHtml +
    '<div class="card"><div class="card-head"><div><h3>Prioridades de hoje</h3><p>Quentes por peso e lacuna</p></div><a class="badge blue" href="#/pareto">Pareto</a></div>' + priorityRows + "</div>" +
    pomoHtml + "</div>" +

    (errs ? '<div class="notice warn mt-16">' + icon("alert", "") + "<div><b>" + errs + " questão" + (errs > 1 ? "ões" : "") + " no caderno de erros.</b> Reteste os itens errados antes de avançar: erro corrigido vale mais que aula nova. <a href=\"#/erros\">Abrir caderno</a></div></div>" : "") +
    ap2Html +

    '<div class="grid grid-2 mt-16">' +
    '<div class="card"><div class="card-head"><div><h3>Arquitetura da nota e meta</h3><p>Formato de referência do simulado</p></div><span class="badge lime">Meta 90%</span></div>' + arch +
    '<p class="tiny muted mt-12">A meta de 90% é uma referência de preparação, não uma previsão. O status de habilitação exige nota mínima global e pelo menos 1 acerto em cada área.</p></div>' +
    '<div class="card"><div class="card-head"><div><h3>Diagnóstico honesto</h3><p>O que os dados permitem afirmar</p></div><span class="badge outline">sem invenção</span></div>' +
    '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span class="small">Simulado oficial</span><b class="small">' + (lastScored ? lastScored.score.toFixed(1).replace(".", ",") + " / 100" : "Sem simulado") + "</b></div>" +
    '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span class="small">Acurácia em questões</span><b class="small">' + (st.attempts ? Math.round(st.accuracy * 100) + "%" : "Sem diagnóstico") + "</b></div>" +
    '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span class="small">Meta pessoal</span><b class="small">' + (state.settings.meta || 90) + "%</b></div>" +
    '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span class="small">Cobertura de aulas</span><b class="small">' + cov + "%</b></div>" +
    '<div class="row" style="justify-content:space-between;padding:8px 0"><span class="small">Casos clínicos salvos</span><b class="small">' + Object.keys(state.cases).length + " / " + CASES.length + "</b></div>" +
    (lastScored && lastScored.zeroed.length ? '<div class="notice danger mt-12">' + icon("alert", "") + "<div>Último simulado com área zerada: <b>" + lastScored.zeroed.map((z) => AREA_BY_ID[z.area].name).join(", ") + "</b>. Isso elimina, independentemente da nota total.</div></div>" : "") +
    '<p class="tiny muted mt-12">Enquanto não houver tentativas, o painel mostra “Sem diagnóstico”. Nenhum KPI é preenchido com números fictícios.</p></div></div>' +

    pageFoot();
}

function blockAction(block, style) {
  if (!block) return "";
  const cls = "btn " + (style || "sm");
  if (block.action === "lesson" && block.topicId) return '<button class="' + cls + '" data-action="open-lesson" data-topic="' + block.topicId + '">Abrir aula ' + icon("arrow", "") + "</button>";
  if (block.action === "ap2" && block.ap2Module) return '<button class="' + cls + '" data-action="open-ap2-lesson" data-module="' + block.ap2Module + '">Abrir AP2 ' + icon("arrow", "") + "</button>";
  if (block.action === "sim") return '<a class="' + cls + '" href="#/simulado">Abrir simulado ' + icon("arrow", "") + "</a>";
  if (block.action === "cards") return '<a class="' + cls + '" href="#/flashcards">Flashcards ' + icon("arrow", "") + "</a>";
  if (block.action === "errors") return '<a class="' + cls + '" href="#/erros">Caderno de erros ' + icon("arrow", "") + "</a>";
  return '<a class="' + cls + '" href="#/questoes">Praticar ' + icon("arrow", "") + "</a>";
}

/* ------------------------------ Plano ------------------------------ */
function viewPlan() {
  const plan = buildPlan();
  const exam = examDate();
  const examDay = isSameDay(new Date(), exam);
  const now = nowMs();

  let summary = '<div class="grid grid-3 mt-16">' +
    '<div class="card kpi"><div class="kpi-top"><div class="kpi-ico blue">' + icon("clock", "") + '</div><span class="kpi-label">Carga solicitada</span></div><div class="kpi-value">' + fmtMinutes(plan.requested) + '</div><div class="kpi-foot">' + (plan.capped ? "Reduzida para caber na janela" : "Cabe na janela até a prova") + "</div></div>" +
    '<div class="card kpi"><div class="kpi-top"><div class="kpi-ico green">' + icon("calendar", "") + '</div><span class="kpi-label">Plano efetivo</span></div><div class="kpi-value">' + (plan.valid ? fmtMinutes(plan.budget) : "—") + '</div><div class="kpi-foot">' + (plan.valid ? fmtTime(plan.start) + " → " + fmtTime(plan.end) : "Sem janela disponível") + "</div></div>" +
    '<div class="card kpi"><div class="kpi-top"><div class="kpi-ico amber">' + icon("book", "") + '</div><span class="kpi-label">Cobertura do plano</span></div><div class="kpi-value">' + plan.topics + "<small>/" + TOPICS.length + '</small></div><div class="kpi-foot">' + (plan.topics ? "Tópicos prioritários no dia" : "Aulas disponíveis na biblioteca") + "</div></div></div>";

  let body = "";
  if (examDay) {
    body = '<div class="notice danger mt-16">' + icon("alert", "") + "<div><b>É dia de prova.</b> Não há blocos de estudo programados. Use apenas o checklist logístico e a revisão leve de flashcards. Chegue com 60 minutos de antecedência.</div></div>" +
      '<div class="card mt-16"><div class="card-head"><div><h3>Checklist do dia da prova</h3><p>Execução, logística e controle de tempo</p></div><span class="badge red">Hoje</span></div>' + checklistHtml("prova", CHECKLISTS.prova) + "</div>" +
      '<div class="card mt-16"><div class="card-head"><div><h3>Véspera — se ainda não marcou</h3><p>Confira o que ficou pendente</p></div></div>' + checklistHtml("vespera", CHECKLISTS.vespera) + "</div>";
    return pageHead("Plano de hoje", "A prova é hoje: o plano vira checklist de execução.", '<a class="btn" href="#/flashcards">Revisão leve</a>') + summary + body + pageFoot();
  }

  if (!plan.valid) {
    body = '<div class="notice warn mt-16">' + icon("alert", "") + "<div><b>Não há janela útil para montar o plano.</b> " +
      (plan.past ? "A data da prova já passou. Atualize em Meu Plano & Backup." : "O horário de início está muito próximo do fim do dia ou da prova. Ajuste a carga, o horário ou a data.") +
      '</div></div><div class="card mt-16"><div class="empty"><div class="ico">' + icon("calendar", "") + '</div><h3>Ajuste seu plano</h3><p>Defina uma data de prova futura e um horário de início com pelo menos 30 minutos livres.</p><a class="btn primary mt-12" href="#/config">Abrir configurações</a></div></div>';
    return pageHead("Plano de hoje", "O cronograma precisa de uma janela realista até a prova.", "") + summary + body + pageFoot();
  }

  if (plan.capped) {
    body += '<div class="notice warn mt-16">' + icon("alert", "") + "<div><b>Sua carga não cabe inteira antes do descanso.</b> Você pediu " + fmtMinutes(plan.requested) + ", mas a janela até 23h45 permite " + fmtMinutes(plan.budget) + ". O plano foi reduzido e prioriza o essencial. Durma — virar a noite reduz o desempenho.</div></div>";
  }

  const groups = {};
  plan.blocks.forEach((b) => {
    const key = ymd(new Date(b.start));
    groups[key] = groups[key] || [];
    groups[key].push(b);
  });

  let timeline = "";
  Object.keys(groups).forEach((key) => {
    timeline += '<div class="mt-16"><div class="eyebrow">' + fmtDateLong(groups[key][0].start) + "</div>";
    groups[key].forEach((b) => {
      const isCurrent = !b.done && b.start <= now && b.end > now && b.type !== "break";
      if (b.type === "break") {
        timeline += '<div class="tl-item mt-8"><div class="tl-dot"></div><div class="tl-time">' + fmtTime(b.start) + "–" + fmtTime(b.end) + ' · pausa</div><div class="tl-body"><div class="tl-title" style="font-weight:500;color:var(--muted)">' + esc(b.title) + '</div><div class="tl-desc">' + esc(b.desc) + "</div></div></div>";
        return;
      }
      timeline += '<div class="tl-item' + (b.done ? " done" : "") + (isCurrent ? " current-block" : "") + '"><div class="tl-dot"></div>' +
        '<div class="tl-time">' + fmtTime(b.start) + "–" + fmtTime(b.end) + " · " + b.minutes + " min" + (isCurrent ? " · agora" : "") + "</div>" +
        '<div class="tl-body"><div class="tl-title">' + esc(b.title) +
        (b.topicId ? ' <span class="badge ' + TEMP_CLASS[TOPIC_BY_ID[b.topicId].temp] + '">' + TEMP_LABEL[TOPIC_BY_ID[b.topicId].temp] + "</span>" : "") +
        (b.ap2Module ? ' <span class="badge purple">AP2</span>' : "") +
        (b.done ? ' <span class="badge green">Concluído</span>' : "") + "</div>" +
        '<div class="tl-desc">' + esc(b.desc) + "</div>" +
        '<div class="row mt-8"><label class="block-check"><input type="checkbox" data-action="toggle-block" data-block="' + b.id + '"' + (b.done ? " checked" : "") + "> concluir</label>" +
        '<div class="spacer"></div>' + blockAction(b, "sm") + "</div></div></div>";
    });
    timeline += "</div>";
  });

  body += '<div class="grid mt-16" style="grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr)">' +
    '<div class="card"><div class="card-head"><div><h3>Linha do tempo</h3><p>Blocos ordenados por prioridade; intervalos contam na carga.</p></div><button class="btn sm" data-action="export-plan">' + icon("download", "") + "CSV</button></div>" + timeline + "</div>" +
    '<div class="stack">' +
    '<div class="card"><div class="card-head"><div><h3>Cobertura vs. programa</h3><p>Transparência do que cabe hoje</p></div></div>' +
    '<div class="progress-label"><span>' + plan.topics + " tópicos no plano</span><span>" + TOPICS.length + ' no total</span></div><div class="progress green"><i style="width:' + Math.round((plan.topics / TOPICS.length) * 100) + '%"></i></div>' +
    '<p class="small muted mt-12">Os demais tópicos seguem disponíveis em Aulas e no banco de questões. O plano de um dia não finge cobrir o edital inteiro; ele prioriza o maior retorno.</p>' +
    '<div class="notice info mt-12">' + icon("info", "") + "<div>Alta prioridade: oncologia, litíase, infecções e emergências. Tópicos frios ficam para consulta rápida, nunca omitidos.</div></div></div>" +
    '<div class="card"><div class="card-head"><div><h3>Véspera</h3><p>Checklist para hoje à noite</p></div></div>' + checklistHtml("vespera", CHECKLISTS.vespera) + "</div>" +
    '<div class="card"><div class="card-head"><div><h3>Dia da prova</h3><p>Deixe pronto antes de dormir</p></div></div>' + checklistHtml("prova", CHECKLISTS.prova) + "</div>" +
    "</div></div>";

  const actions = '<button class="btn" data-action="plan-now">' + icon("clock", "") + ' Começar agora</button><button class="btn primary" data-action="export-plan">' + icon("download", "") + " Exportar CSV</button>";
  return pageHead("Plano de " + (examDay ? "hoje" : "reta final"), "Cronograma construído a partir da sua carga, do horário de início e da data da prova.", actions) + summary + body + pageFoot();
}

function checklistHtml(list, items) {
  return '<div class="mt-8">' + items.map((it) => {
    const key = list + ":" + it.id;
    const done = !!(state.checklists[key] && state.checklists[key].done);
    return '<label class="check-item' + (done ? " done" : "") + '"><input type="checkbox" data-action="toggle-check" data-list="' + list + '" data-id="' + it.id + '"' + (done ? " checked" : "") + '><span><span class="ci-title">' + esc(it.title) + '</span><span class="ci-desc">' + esc(it.desc) + "</span></span></label>";
  }).join("") + "</div>";
}

</script>

<script>
/* ===== app-20-lessons-questions.js ===== */
/* ==========================================================================
   URO 90 — Aulas e questões
   ========================================================================== */

function filteredLessons() {
  const q = ui.lessonQ.trim().toLowerCase();
  return LESSONS.filter((l) => {
    const t = TOPIC_BY_ID[l.topicId];
    if (!t) return false;
    if (ui.lessonArea !== "all" && t.area !== ui.lessonArea) return false;
    if (ui.lessonTemp !== "all" && t.temp !== ui.lessonTemp) return false;
    if (q) {
      const hay = (l.title + " " + t.title + " " + (t.subtopics || []).join(" ") + " " + AREA_BY_ID[t.area].name).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function viewLessons() {
  const list = filteredLessons();
  const areaOpts = '<option value="all">Todas as áreas</option>' + AREAS.map((a) => '<option value="' + a.id + '"' + (ui.lessonArea === a.id ? " selected" : "") + ">" + a.name + "</option>").join("");
  const tempOpts = '<option value="all">Todas as temperaturas</option><option value="hot"' + (ui.lessonTemp === "hot" ? " selected" : "") + '>Quente</option><option value="warm"' + (ui.lessonTemp === "warm" ? " selected" : "") + '>Morna</option><option value="cold"' + (ui.lessonTemp === "cold" ? " selected" : "") + ">Fria</option>";

  const cards = list.map((l) => {
    const t = TOPIC_BY_ID[l.topicId];
    const area = AREA_BY_ID[t.area];
    const done = lessonDone(t.id);
    const st = topicStats(t.id);
    return '<div class="card lesson-card' + (done ? " done" : "") + '">' +
      '<div class="lc-top"><span class="badge ' + TEMP_CLASS[t.temp] + '">' + TEMP_LABEL[t.temp] + '</span><span class="badge outline">' + area.short + "</span>" +
      (done ? '<span class="badge green">Concluída</span>' : "") + '<span class="spacer"></span><span class="tiny muted">' + l.minutes + " min</span></div>" +
      "<h3>" + esc(l.title) + "</h3>" +
      '<p>' + esc((t.subtopics || []).slice(0, 3).join(" · ")) + "</p>" +
      '<div class="lesson-meta"><span>' + st.total + " questões</span><span>" + (st.accuracy == null ? "sem diagnóstico" : Math.round(st.accuracy * 100) + "% acerto") + "</span></div>" +
      '<div class="row" style="gap:6px"><button class="btn sm primary" data-action="open-lesson" data-topic="' + t.id + '">Ler aula</button>' +
      '<button class="btn sm" data-action="lesson-questions" data-topic="' + t.id + '">Questões</button></div></div>';
  }).join("");

  const actions = '<span class="badge green">' + lessonCountDone() + "/" + TOPICS.length + " concluídas</span>";
  return pageHead("Aulas de urologia", "Conteúdo denso, orientado a conduta e a pegadinhas de prova. Cada tópico tem questões e flashcards vinculados.", actions) +
    '<div class="toolbar"><div class="search">' + icon("search", "") + '<input class="input" id="lesson-search" data-search="lessonQ" placeholder="Buscar por tema, subtópico ou área…" value="' + esc(ui.lessonQ) + '"></div>' +
    '<select class="select" data-filter="lessonArea">' + areaOpts + "</select>" +
    '<select class="select" data-filter="lessonTemp">' + tempOpts + "</select>" +
    '<span class="spacer"></span><span class="small muted">' + list.length + " aulas</span></div>" +
    (list.length ? '<div class="grid grid-3">' + cards + "</div>" : '<div class="card"><div class="empty"><div class="ico">' + icon("search", "") + "</div><h3>Nenhuma aula encontrada</h3><p>Ajuste a busca ou os filtros. Todos os 28 tópicos continuam disponíveis.</p></div></div>") +
    pageFoot();
}

function openLesson(topicId) {
  const topic = TOPIC_BY_ID[topicId];
  const lesson = LESSON_BY_TOPIC[topicId];
  if (!topic || !lesson) return;
  const area = AREA_BY_ID[topic.area];
  const done = lessonDone(topicId);
  const root = $("#modal-root");
  if (!root) return;
  root.innerHTML = '<div class="modal-backdrop" data-action="close-modal"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Aula: ' + esc(lesson.title) + '" data-modal-panel>' +
    '<div class="modal-head"><div><div class="lesson-meta-line"><span class="badge ' + TEMP_CLASS[topic.temp] + '">' + TEMP_LABEL[topic.temp] + '</span><span class="badge outline">' + area.short + '</span><span class="tiny muted">' + lesson.minutes + " min de leitura</span></div>" +
    "<h2>" + esc(lesson.title) + "</h2><p>Tópico: " + esc(topic.title) + "</p></div>" +
    '<button class="modal-close" data-action="close-modal" aria-label="Fechar">' + icon("x", "") + "</button></div>" +
    '<div class="modal-body"><div class="lesson-body">' + lesson.sections.concept + lesson.sections.practice + lesson.sections.retention +
    '<h2>Erros comuns e pegadinhas da banca</h2><ul>' + lesson.pitfalls.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul>" +
    '<div class="callout green"><strong>Fonte técnica/normativa:</strong> ' + esc(lesson.source) + ". Conteúdo autoral de revisão; confira a versão vigente da diretriz e o material da sua disciplina.</div>" +
    "</div></div>" +
    '<div class="modal-foot"><button class="btn ' + (done ? "" : "success") + '" data-action="lesson-done" data-topic="' + topicId + '">' + (done ? "Desmarcar estudada" : "Marcar como estudada") + "</button>" +
    '<button class="btn primary" data-action="lesson-questions" data-topic="' + topicId + '">Treinar questões ' + icon("arrow", "") + "</button>" +
    '<div class="spacer"></div><button class="btn ghost" data-action="close-modal">Fechar</button></div></div></div>';
  document.body.style.overflow = "hidden";
  ui.modalOpen = true;
  const close = $("[data-action='close-modal']", root);
  if (close) close.focus();
}

function closeModal() {
  const root = $("#modal-root");
  if (root) root.innerHTML = "";
  document.body.style.overflow = "";
  ui.modalOpen = false;
}

function toggleLessonDone(topicId) {
  if (lessonDone(topicId)) delete state.lessons[topicId];
  else state.lessons[topicId] = { done: true, at: nowMs() };
  saveState();
  const btn = $('[data-action="lesson-done"][data-topic="' + topicId + '"]');
  if (btn) {
    const done = lessonDone(topicId);
    btn.textContent = done ? "Desmarcar estudada" : "Marcar como estudada";
    btn.className = "btn " + (done ? "" : "success");
  }
  renderShell();
  renderView();
  toast(lessonDone(topicId) ? "Aula marcada como estudada." : "Marcação removida.", "ok");
}

/* ------------------------------ Questões ------------------------------ */
function questionList() {
  let list = QUESTIONS.slice();
  if (ui.qBank === "ap2") list = list.filter((q) => q.bank === "ap2");
  if (ui.qBank === "broad") list = list.filter((q) => q.bank !== "ap2");
  if (ui.qModule !== "all") list = list.filter((q) => q.ap2Module === ui.qModule);
  if (ui.qArea !== "all") list = list.filter((q) => q.area === ui.qArea);
  if (ui.qTopic !== "all") list = list.filter((q) => q.topicId === ui.qTopic);
  if (ui.qStatus === "unanswered") list = list.filter((q) => !isAnswered(q.id));
  if (ui.qStatus === "errors") list = list.filter((q) => { const a = lastAttempt(q.id); return a && !a.correct; });
  if (ui.qStatus === "correct") list = list.filter((q) => isCorrectLast(q.id));
  const term = ui.qSearch.trim().toLowerCase();
  if (term) list = list.filter((q) => (q.stem + " " + q.options.join(" ") + " " + TOPIC_BY_ID[q.topicId].title + " " + (q.origin || "")).toLowerCase().includes(term));

  if (ui.qFocus) {
    const focus = ui.qFocus;
    const idx = list.findIndex((q) => q.id === focus);
    if (idx >= 0) { ui.qIndex = idx; list = list; }
    else if (Q_BY_ID[focus]) { list = [Q_BY_ID[focus]]; ui.qIndex = 0; }
    ui.qFocus = null;
  }
  if (list.length) ui.qIndex = clamp(ui.qIndex, 0, list.length - 1);
  else ui.qIndex = 0;
  return list;
}

function currentQuestion(list) {
  return list && list.length ? list[ui.qIndex] : null;
}

function viewQuestions() {
  const list = questionList();
  const q = currentQuestion(list);
  const st = globalStats();
  const bankOpts = [["all", "Todos os bancos (96)"], ["broad", "Banco amplo (60)"], ["ap2", "AP2 2026.2 (36)"]].map(([v, l]) => '<option value="' + v + '"' + (ui.qBank === v ? " selected" : "") + ">" + l + "</option>").join("");
  const moduleOpts = '<option value="all">Todos os módulos AP2</option>' + AP2_MODULES.map((m) => '<option value="' + m.id + '"' + (ui.qModule === m.id ? " selected" : "") + ">" + m.code + " · " + m.short + "</option>").join("");
  const areaOpts = '<option value="all">Todas as áreas</option>' + AREAS.map((a) => '<option value="' + a.id + '"' + (ui.qArea === a.id ? " selected" : "") + ">" + a.name + "</option>").join("");
  const topicPool = ui.qArea === "all" ? TOPICS : TOPICS.filter((t) => t.area === ui.qArea);
  const topicOpts = '<option value="all">Todos os tópicos</option>' + topicPool.map((t) => '<option value="' + t.id + '"' + (ui.qTopic === t.id ? " selected" : "") + ">" + t.title + "</option>").join("");
  const statusOpts = [["all", "Todas"], ["unanswered", "Não respondidas"], ["errors", "Erros"], ["correct", "Acertos"]].map(([v, l]) => '<option value="' + v + '"' + (ui.qStatus === v ? " selected" : "") + ">" + l + "</option>").join("");

  let content = "";
  if (!q) {
    content = '<div class="card"><div class="empty"><div class="ico">' + icon("help", "") + '</div><h3>Nenhuma questão com esses filtros</h3><p>Limpe os filtros ou escolha outra área. O banco tem ' + QUESTIONS.length + ' itens comentados: ' + (QUESTIONS.length - AP2_QUESTIONS.length) + ' amplos + ' + AP2_QUESTIONS.length + ' históricos AP2.</p><button class="btn primary mt-12" data-action="q-clear">Limpar filtros</button></div></div>';
  } else {
    const topic = TOPIC_BY_ID[q.topicId];
    const area = AREA_BY_ID[q.area];
    const isAp2 = q.bank === "ap2";
    const ap2Mod = isAp2 ? AP2_BY_ID[q.ap2Module] : null;
    const last = lastAttempt(q.id);
    const locked = !!last && !ui.qRetest;
    const choice = locked ? last.choice : ui.qChoice;
    const options = q.options.map((opt, i) => {
      let cls = "option";
      if (locked) {
        if (i === q.answer) cls += " correct";
        else if (i === choice) cls += " wrong";
        else cls += " dim";
      } else if (i === choice) cls += " selected";
      return '<button class="' + cls + '" data-action="q-select" data-index="' + i + '"' + (locked ? " disabled" : "") + ">" +
        '<span class="letter">' + "ABCDE"[i] + "</span><span>" + esc(opt) + "</span></button>";
    }).join("");

    let answerBox = "";
    if (locked) {
      const ok = last.correct;
      const provenance = isAp2
        ? "<b>Origem:</b> " + esc(q.origin) + " · <b>gabarito histórico preservado</b>"
        : "<b>Autoral (padrão da prova)</b>";
      const caveat = isAp2 && q.caveat ? '<div class="callout warn mt-12"><strong>Atualização 2026:</strong> ' + esc(q.caveat) + "</div>" : "";
      answerBox = '<div class="answer-box ' + (ok ? "ok" : "bad") + '"><div class="answer-title">' + (ok ? '<span class="badge green">Correta</span> Você marcou ' + "ABCDE"[last.choice] : '<span class="badge red">Incorreta</span> Você marcou ' + "ABCDE"[last.choice] + "; o gabarito é " + "ABCDE"[q.answer]) + "</div>" +
        "<p>" + esc(q.comment) + "</p><div class=\"src\"><b>Fonte:</b> " + esc(q.source) + " · " + provenance + "</div>" + caveat + "</div>";
    }

    const actions = locked
      ? '<button class="btn primary" data-action="q-next">Próxima ' + icon("arrow", "") + "</button>" +
        '<button class="btn" data-action="q-retest">' + icon("rotate", "") + " Refazer</button>" +
        (!last.correct ? '<a class="btn" href="#/erros">Ir ao caderno de erros</a>' : "") +
        '<div class="spacer"></div><a class="btn ghost" href="#/aulas">Ler aula do tópico</a>'
      : '<button class="btn primary" data-action="q-submit"' + (choice == null ? " disabled" : "") + ">Responder e salvar</button>" +
        '<div class="spacer"></div><button class="btn ghost" data-action="q-prev">' + icon("chevronLeft", "") + " Anterior</button>" +
        '<button class="btn ghost" data-action="q-next">Próxima ' + icon("chevronRight", "") + "</button>";

    const nav = list.map((item, i) => {
      const a = lastAttempt(item.id);
      let cls = "";
      if (a) cls = a.correct ? "right" : "wrong";
      if (i === ui.qIndex) cls += " current";
      return '<button class="' + cls + '" data-action="q-index" data-index="' + i + '" aria-label="Questão ' + (i + 1) + '">' + (i + 1) + "</button>";
    }).join("");

    content = '<div class="q-layout"><aside class="card q-side"><div class="card-head"><div><h3>Cartão</h3><p>' + list.length + " questões no filtro</p></div></div>" +
      '<div class="q-nav-grid">' + nav + "</div>" +
      '<div class="mt-16 small muted">' + st.answered + " de " + QUESTIONS.length + " respondidas<br>" + (st.attempts ? "Acurácia global: <b>" + Math.round(st.accuracy * 100) + "%</b>" : "Sem diagnóstico ainda") + "</div>" +
      '<div class="progress mt-8"><i style="width:' + Math.round((st.answered / QUESTIONS.length) * 100) + '%"></i></div></aside>' +
      '<section class="card q-card"><div class="q-meta"><span class="badge outline">' + area.short + '</span><span class="badge ' + TEMP_CLASS[topic.temp] + '">' + TEMP_LABEL[topic.temp] + '</span><span class="badge blue">' + DIFF_LABEL[q.difficulty] + '</span>' +
      (isAp2 ? '<span class="badge purple">AP2 · ' + ap2Mod.code + '</span><span class="badge outline">Histórica</span>' : '<span class="badge outline">Autoral</span>') +
      '<span class="spacer"></span><span class="tiny muted">' + (ui.qIndex + 1) + " / " + list.length + "</span></div>" +
      '<div class="tiny muted mb-8">' + esc(topic.title) + (isAp2 ? " · Origem: " + esc(q.origin) : "") + "</div>" +
      '<div class="q-stem"><p>' + esc(q.stem) + "</p></div>" +
      '<div class="options">' + options + "</div>" + answerBox +
      '<div class="q-actions">' + actions + "</div></section></div>";
  }

  return pageHead("Banco de questões", "Responda, salve e leia o comentário. Itens amplos e históricos AP2 usam o mesmo motor de correção e caderno de erros.", '<span class="badge green">' + st.answered + "/" + QUESTIONS.length + "</span>") +
    '<div class="toolbar"><select class="select" data-filter="qBank">' + bankOpts + "</select>" +
    '<select class="select" data-filter="qModule">' + moduleOpts + "</select>" +
    '<select class="select" data-filter="qArea">' + areaOpts + "</select>" +
    '<select class="select" data-filter="qTopic">' + topicOpts + "</select>" +
    '<select class="select" data-filter="qStatus">' + statusOpts + "</select>" +
    '<div class="search">' + icon("search", "") + '<input class="input" id="q-search" data-search="qSearch" placeholder="Buscar no enunciado…" value="' + esc(ui.qSearch) + '"></div></div>' +
    content + pageFoot();
}

</script>

<script>
/* ===== app-25-ap2.js ===== */
/* ==========================================================================
   URO 90 — Trilha AP2 2026.2: painel, aulas e progresso
   ========================================================================== */

function ap2ModuleCard(m) {
  const st = ap2ModuleStats(m.id);
  const pct = st.total ? Math.round((st.answered / st.total) * 100) : 0;
  const acc = st.accuracy == null ? "sem diagnóstico" : Math.round(st.accuracy * 100) + "% acerto";
  return '<div class="card ap2-module' + (st.lesson ? " done" : "") + '">' +
    '<div class="lc-top"><span class="badge purple">' + m.code + '</span><span class="badge ' + TEMP_CLASS[m.temp] + '">' + esc(m.priority) + '</span>' +
    (st.lesson ? '<span class="badge green">Aula ok</span>' : "") +
    '<span class="spacer"></span><span class="tiny muted">' + m.minutes + " min</span></div>" +
    "<h3>" + esc(m.title) + "</h3>" +
    "<p>" + esc(m.theme) + "</p>" +
    '<div class="ap2-origin">' + esc(m.origins) + "</div>" +
    '<div class="ap2-module-stats"><span><b>' + st.total + '</b> questões</span><span><b>' + st.answered + '</b> respondidas</span><span><b>' + acc + '</b></span></div>' +
    '<div class="progress sm"><i style="width:' + pct + '%"></i></div>' +
    '<div class="row mt-12" style="gap:6px"><button class="btn sm primary" data-action="open-ap2-lesson" data-module="' + m.id + '">Abrir aula AP2</button>' +
    '<button class="btn sm" data-action="ap2-questions" data-module="' + m.id + '">Treinar ' + st.total + ' questões</button></div></div>';
}

function viewAp2() {
  const overall = ap2Overall();
  const next = ap2NextModule();
  const moduleCards = AP2_MODULES.map(ap2ModuleCard).join("");
  const layers = (AP2_META.layers || []).map((l) =>
    '<div class="ap2-layer"><span class="ap2-layer-n">' + l.n + '</span><div><b>' + esc(l.title) + '</b><p>' + esc(l.desc) + "</p></div></div>"
  ).join("");
  const caveats = AP2_MODULES.map((m) => (m.lesson.caveats || []).map((c) =>
    '<div class="ap2-caveat"><div class="tiny muted">' + m.code + " · " + esc(m.short) + '</div><b>' + esc(c.title) + "</b><p>" + esc(c.body) + "</p></div>"
  ).join("")).join("");
  const sources = AP2_SOURCES.map((s) =>
    "<tr><td><b>" + esc(s.title) + "</b><div class=\"tiny muted\">" + esc(s.org) + " · " + esc(s.type) + "</div></td><td class=\"wrap\">" + esc(s.note) + (s.url ? ' <a href="' + esc(s.url) + '" target="_blank" rel="noopener">abrir</a>' : "") + "</td></tr>"
  ).join("");

  const actions = '<span class="badge purple">' + overall.modules + " módulos</span>" +
    '<span class="badge ' + (overall.answered ? "green" : "outline") + '">' + overall.answered + "/" + overall.total + " questões</span>" +
    '<button class="btn" data-action="export-ap2">' + icon("download", "") + " CSV</button>";

  return pageHead("AP2 2026.2 — Compilado definitivo", "Trilha específica construída a partir do PDF de revisão: 4 módulos, 36 questões históricas e atualização clínica 2026. O banco amplo continua disponível.", actions) +
    '<div class="ap2-hero"><div><div class="eyebrow">MEDCID · UEA/ESA · revisão 2026.2</div><h2>Três camadas, um só objetivo: entender o gabarito e a prática atual.</h2>' +
    "<p>" + esc(AP2_META.scope) + "</p>" +
    '<div class="ap2-hero-stats"><div><b>' + overall.modules + '</b><span>módulos</span></div><div><b>' + overall.total + '</b><span>questões históricas</span></div><div><b>' + overall.lessonsDone + "/" + overall.modules + '</b><span>aulas concluídas</span></div><div><b>' + (overall.accuracy == null ? "—" : Math.round(overall.accuracy * 100) + "%") + '</b><span>acurácia AP2</span></div></div></div>' +
    '<div class="ap2-next"><div class="tiny" style="color:#c4b5fd;text-transform:uppercase;letter-spacing:.1em">Próximo passo</div>' +
    (next ? "<b>" + next.code + " · " + esc(next.title) + "</b><p>" + esc(next.summary) + "</p>" +
      '<div class="row mt-8"><button class="btn primary sm" data-action="open-ap2-lesson" data-module="' + next.id + '">Estudar agora ' + icon("arrow", "") + "</button>" +
      '<button class="btn sm" data-action="ap2-questions" data-module="' + next.id + '">Só questões</button></div>'
      : "<b>Trilha concluída.</b><p>Você marcou as 4 aulas e respondeu aos 36 itens. Refaça os erros e use o simulado para consolidar.</p>") + "</div></div>" +
    '<div class="notice info mt-16">' + icon("info", "") + "<div><b>Escopo honesto:</b> " + esc(AP2_META.caveat) + "</div></div>" +
    '<div class="grid grid-3 mt-16">' + layers + "</div>" +
    '<div class="card mt-16"><div class="card-head"><div><h3>Módulos da AP2</h3><p>Abra a aula, leia as atualizações 2026 e treine as questões históricas com comentário.</p></div><span class="badge outline">' + overall.lessonsDone + "/" + overall.modules + ' aulas</span></div><div class="grid grid-2">' + moduleCards + "</div></div>" +
    '<div class="grid grid-2 mt-16"><div class="card"><div class="card-head"><div><h3>Como usar sem se perder</h3><p>Método de 3 passadas</p></div></div><ol class="ap2-steps">' +
    "<li><b>Leia a aula do módulo.</b> Fixe a fisiopatologia/conduta-base antes de olhar o gabarito.</li>" +

    "<li><b>Volte pelo caderno de erros.</b> Erro corrigido vale mais que aula nova; refaça os itens e leia a regra de ouro.</li></ol>" +
    '<div class="notice warn mt-12">' + icon("alert", "") + "<div><b>Não é previsão de prova.</b> O programa 2026.2 não distribui oficialmente cada tema por prova. As questões são históricas e a origem é preservada.</div></div></div>" +
    '<div class="card"><div class="card-head"><div><h3>Atualizações 2026</h3><p>Onde o ensino antigo diverge da prática</p></div><span class="badge green">' + AP2_MODULES.reduce((a, m) => a + (m.lesson.caveats || []).length, 0) + " notas</span></div><div class=\"ap2-caveat-list\">" + caveats + "</div></div></div>" +
    '<div class="card mt-16"><div class="card-head"><div><h3>Fontes e rastreabilidade</h3><p>Material-base, diretrizes e protocolo</p></div><span class="badge outline">' + AP2_SOURCES.length + " fontes</span></div><div class=\"table-wrap\"><table class=\"tbl\"><thead><tr><th>Fonte</th><th>Uso</th></tr></thead><tbody>" + sources + "</tbody></table></div>" +
    '<p class="tiny muted mt-12">Plataforma autoral de revisão. O conteúdo resume o material da disciplina e diretrizes públicas; não substitui a aula, o professor ou avaliação médica individual.</p></div>' +
    pageFoot();
}

function openAp2Lesson(moduleId) {
  const m = AP2_BY_ID[moduleId];
  if (!m) return;
  const lesson = m.lesson;
  const done = ap2LessonDone(moduleId);
  const root = $("#modal-root");
  if (!root) return;
  const caveats = (lesson.caveats || []).map((c) =>
    '<div class="callout warn"><strong>' + esc(c.title) + ":</strong> " + esc(c.body) + "</div>"
  ).join("");
  root.innerHTML = '<div class="modal-backdrop" data-action="close-modal"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Aula AP2: ' + esc(lesson.title) + '" data-modal-panel>' +
    '<div class="modal-head"><div><div class="lesson-meta-line"><span class="badge purple">AP2 · ' + m.code + '</span><span class="badge ' + TEMP_CLASS[m.temp] + '">' + esc(m.priority) + '</span><span class="tiny muted">' + m.minutes + " min de leitura</span></div>" +
    "<h2>" + esc(lesson.title) + "</h2><p>" + esc(m.origins) + "</p></div>" +
    '<button class="modal-close" data-action="close-modal" aria-label="Fechar">' + icon("x", "") + "</button></div>" +
    '<div class="modal-body"><div class="lesson-body">' + lesson.sections.concept + lesson.sections.practice + lesson.sections.retention +
    "<h2>Atualizações 2026</h2>" + (caveats || '<p class="small muted">Sem divergência registrada para este módulo.</p>') +
    "<h2>Regras de ouro do módulo</h2><ul>" + (lesson.rules || []).map((r) => "<li>" + esc(r) + "</li>").join("") + "</ul>" +
    "<h2>Pegadinhas da banca</h2><ul>" + (lesson.pitfalls || []).map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul>" +
    '<div class="callout green"><strong>Fonte técnica/normativa:</strong> ' + esc(lesson.source) + ". O gabarito histórico é preservado; a atualização 2026 é indicada separadamente. Confira a versão vigente da diretriz e o material da sua disciplina.</div>" +
    "</div></div>" +
    '<div class="modal-foot"><button class="btn ' + (done ? "" : "success") + '" data-action="ap2-lesson-done" data-module="' + m.id + '">' + (done ? "Desmarcar estudada" : "Marcar como estudada") + "</button>" +
    '<button class="btn primary" data-action="ap2-questions" data-module="' + m.id + '">Treinar ' + m.questions + ' questões ' + icon("arrow", "") + "</button>" +
    '<div class="spacer"></div><button class="btn ghost" data-action="close-modal">Fechar</button></div></div></div>';
  document.body.style.overflow = "hidden";
  ui.modalOpen = true;
  const close = $("[data-action='close-modal']", root);
  if (close) close.focus();
}

function toggleAp2LessonDone(moduleId) {
  const key = "ap2:" + moduleId;
  if (ap2LessonDone(moduleId)) delete state.lessons[key];
  else state.lessons[key] = { done: true, at: nowMs() };
  saveState();
  const btn = $('[data-action="ap2-lesson-done"][data-module="' + moduleId + '"]');
  if (btn) {
    const done = ap2LessonDone(moduleId);
    btn.textContent = done ? "Desmarcar estudada" : "Marcar como estudada";
    btn.className = "btn " + (done ? "" : "success");
  }
  renderShell();
  renderView();
  toast(ap2LessonDone(moduleId) ? "Aula AP2 marcada como estudada." : "Marcação removida.", "ok");

<script>
/* ===== app-30-cards-sim.js ===== */

function flashcardList() {
  let list;
  if (ui.cardMode === "queue") list = dueCards();
  else list = CARDS.slice();
  if (ui.cardArea !== "all") list = list.filter((c) => TOPIC_BY_ID[c.topicId].area === ui.cardArea);
  if (ui.cardMode === "queue") {
    list = list.slice().sort((a, b) => {
      const ra = cardRecord(a.id), rb = cardRecord(b.id);
      if (!ra && !rb) return 0;
      if (!ra) return -1;
      if (!rb) return 1;
      return (ra.due || 0) - (rb.due || 0);
    });
  }
  if (list.length) ui.cardIndex = clamp(ui.cardIndex, 0, list.length - 1);
  else ui.cardIndex = 0;

}

function viewFlashcards() {

  let stage = "";

  } else {

      (card.ap2Module && AP2_BY_ID[card.ap2Module] ? '<span class="badge purple">AP2 · ' + AP2_BY_ID[card.ap2Module].code + "</span>" : "") +

        : '<div class="notice info">' + icon("info", "") + "<div>Tente responder mentalmente antes de virar. A recordação ativa vale mais que reler.</div></div>") +
      '<div class="fc-stats"><span><b>' + due + "</b> vencidos</span><span><b>" + newc + "</b> novos</span><span><b>" + matureCards().length + "</b> maduros</span><span>tópico: " + esc(topic.title) + "</span></div></div>";
  }

function rateCard(cardId, rating) {
  const card = CARD_BY_ID[cardId];
  if (!card) return;
  const prev = cardRecord(cardId) || { reps: 0, lapses: 0, interval: 0, due: 0 };
  let interval = 0;
  let reps = prev.reps || 0;
  let lapses = prev.lapses || 0;
  let due = nowMs();
  if (rating === "again") {
    interval = 0;
    reps = 0;
    lapses += 1;
    due = nowMs() + 10 * 60000;
  } else if (rating === "hard") {
    reps += 1;
    const seq = [1, 3, 7];
    interval = seq[Math.min(reps - 1, seq.length - 1)];
    due = nowMs() + interval * 86400000;
  } else {
    reps += 1;
    const seq = [1, 7, 14, 30];
    interval = seq[Math.min(reps - 1, seq.length - 1)];
    due = nowMs() + interval * 86400000;
  }
  state.flashcards[cardId] = { due, interval, reps, lapses, last: nowMs(), rating };
  saveState();
  ui.cardFlipped = false;
  const list = flashcardList();
  if (ui.cardIndex >= list.length) ui.cardIndex = 0;
  renderShell();
  renderView();
  toast(rating === "again" ? "Card reagendado para daqui a 10 minutos." : "Revisão agendada em " + interval + " dia" + (interval > 1 ? "s" : "") + ".", "ok");
}

/* ------------------------------ Simulado ------------------------------ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickSimQuestions() {
  const picked = [];
  const used = new Set();
  const poolable = QUESTIONS.filter((q) => q.options.length === 5);
  AREAS.forEach((area) => {
    const need = area.questions;
    let pool = poolable.filter((q) => q.area === area.id && !used.has(q.id));
    pool = shuffle(pool).sort((a, b) => attemptsOf(a.id).length - attemptsOf(b.id).length);
    pool.slice(0, need).forEach((q) => { picked.push(q.id); used.add(q.id); });
  });
  let missing = EXAM.objective.questions - picked.length;
  if (missing > 0) {
    const rest = shuffle(poolable.filter((q) => !used.has(q.id)));
    rest.slice(0, missing).forEach((q) => { picked.push(q.id); used.add(q.id); });
  }
  return shuffle(picked).slice(0, EXAM.objective.questions);
}

function activeSim() { return state.activeSim; }

function simElapsedMs(sim) {
  if (!sim) return 0;
  let ms = sim.elapsed || 0;
  if (sim.runningSince) ms += nowMs() - sim.runningSince;
  return ms;
}

function viewSimulado() {
  if (ui.simResult) {
    const sim = state.sims.find((s) => s.id === ui.simResult);
    if (sim) return simResultView(sim);
    ui.simResult = null;
  }
  const sim = activeSim();
  if (sim) return simInterface(sim);
  return simLanding();
}

    AREAS.map((a) => "<tr><td>" + a.name + '</td><td class="num">' + a.questions + '</td><td class="num">' + (a.questions * EXAM.objective.perQuestion).toFixed(1).replace(".", ",") + '</td><td class="num">' + QUESTIONS.filter((q) => q.area === a.id).length + "</td></tr>").join("") +
    '<tr><td class="strong">Total</td><td class="num strong">' + EXAM.objective.questions + '</td><td class="num strong">100,0</td><td class="num">' + QUESTIONS.length + "</td></tr></tbody></table></div>";

  const historyHtml = history.length
    ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Modo</th><th class="num">Acertos</th><th class="num">Nota</th><th>Status</th><th></th></tr></thead><tbody>' +
      history.map((s) => {

        return "<tr><td>" + fmtDateTime(s.finishedAt || s.createdAt || nowMs()) + "</td><td>" + (s.mode === "oficial" ? "Oficial" : "Estudo") + '</td><td class="num">' + sc.correct + "/40</td><td class=\"num\"><b>" + sc.score.toFixed(1).replace(".", ",") + '</b></td><td>' +
          (sc.habilitado ? '<span class="badge green">Habilitado</span>' : sc.zeroed.length ? '<span class="badge red">Área zerada</span>' : '<span class="badge warm">Abaixo do corte</span>') +
          '</td><td><button class="btn sm" data-action="sim-result" data-id="' + s.id + '">Ver</button></td></tr>';

  return pageHead("Simulado oficial", "40 itens na distribuição do painel, 5 alternativas e 2,5 pontos por acerto. Cronômetro contínuo ou modo estudo com pausa.", '<span class="badge blue">' + EXAM.objective.questions + " itens · " + EXAM.objective.points + " pts</span>") +
    '<div class="sim-hero"><div><div class="eyebrow" style="color:#93c5fd">Diagnóstico de verdade</div><h2>Uma prova completa, sem repetir item na mesma rodada.</h2><p>O placar por área mostra onde você perderia pontos e se alguma área foi zerada — critério eliminatório. Cada erro alimenta o caderno de erros automaticamente.</p></div>' +
    '<div class="sim-timer"><b>60:00</b><span>limite no modo oficial</span></div></div>' +
    '<div class="grid grid-2 mt-16"><div class="card"><div class="card-head"><div><h3>Começar agora</h3><p>Escolha o modo de aplicação</p></div></div>' +
    '<div class="stack"><button class="btn primary lg block" data-action="start-sim" data-mode="oficial">' + icon("clock", "") + ' Modo oficial — 60 min contínuos</button>' +
    '<button class="btn lg block" data-action="start-sim" data-mode="estudo">' + icon("book", "") + " Modo estudo — com pausa</button>" +
    '<div class="notice info">' + icon("info", "") + "<div>Sem desconto por erro. Responda todas as 40: em branco também conta como erro e pode zerar uma área.</div></div>" +
    '<div class="notice info">' + icon("info", "") + "<div>O simulado usa apenas itens de 5 alternativas. As questões históricas V/F da AP2 continuam disponíveis no banco de questões, mas não entram nos 40 itens.</div></div></div></div>" +
    '<div class="card"><div class="card-head"><div><h3>Distribuição da prova</h3><p>Pesos do painel</p></div></div>' + blueprint + "</div></div>" +
    '<div class="card mt-16"><div class="card-head"><div><h3>Histórico de simulados</h3><p>Resultados reais, salvos neste dispositivo</p></div><span class="badge outline">' + history.length + " finalizados</span></div>" + historyHtml + "</div>" + pageFoot();
}

function simInterface(sim) {
  const order = sim.order;
  const qid = order[ui.simIndex];
  const q = Q_BY_ID[qid];
  const topic = TOPIC_BY_ID[q.topicId];

  const answered = Object.keys(sim.answers || {}).length;
  const remaining = sim.mode === "oficial" ? Math.max(0, (sim.endsAt || 0) - nowMs()) : simElapsedMs(sim);
  const timerText = sim.mode === "oficial" ? fmtClock(remaining) : fmtClock(remaining);
  const opts = q.options.map((opt, i) => '<button class="option' + (chosen === i ? " selected" : "") + '" data-action="sim-answer" data-index="' + i + '"><span class="letter">' + "ABCDE"[i] + "</span><span>" + esc(opt) + "</span></button>").join("");
  const sheet = order.map((id, i) => {
    const a = sim.answers[id];
    const f = sim.flags && sim.flags[id];
    return '<button class="' + (a != null ? "answered" : "") + (f ? " review" : "") + (i === ui.simIndex ? " current" : "") + '" data-action="sim-goto" data-index="' + i + '"><b>' + (i + 1) + '</b><span class="bubble">' + (a != null ? "ABCDE"[a] : "·") + "</span></button>";
  }).join("");

  return pageHead("Simulado em andamento", (sim.mode === "oficial" ? "Modo oficial · cronômetro contínuo" : "Modo estudo · você pode pausar") + " · rascunho salvo automaticamente", '<span class="badge ' + (sim.mode === "oficial" ? "red" : "blue") + '">' + (sim.mode === "oficial" ? "Oficial" : "Estudo") + "</span>") +
    '<div class="sim-hero"><div><div class="eyebrow" style="color:#93c5fd">Questão ' + (ui.simIndex + 1) + " de " + order.length + "</div><h2>" + answered + " respondidas · " + (order.length - answered) + " em aberto</h2><p>" + (sim.mode === "oficial" ? "O tempo não para. Marque as dúvidas para revisar e volte ao final." : "Use as pausas para consultar o raciocínio, mas evite transformar o simulado em leitura passiva.") + "</p></div>" +
    '<div class="sim-timer"><b id="sim-timer">' + timerText + '</b><span>' + (sim.mode === "oficial" ? "restante" : sim.paused ? "pausado" : "decorrido") + "</span></div></div>" +
    '<div class="sim-q-panel mt-16"><section class="card q-card"><div class="q-meta"><span class="badge outline">' + area.short + '</span><span class="badge ' + TEMP_CLASS[topic.temp] + '">' + TEMP_LABEL[topic.temp] + '</span>' + (flagged ? '<span class="badge warm">Revisar depois</span>' : "") + '<span class="spacer"></span><span class="tiny muted">' + esc(topic.title) + "</span></div>" +
    '<div class="q-stem"><p>' + esc(q.stem) + "</p></div><div class=\"options\">" + opts + "</div>" +
    '<div class="q-actions"><button class="btn" data-action="sim-prev">' + icon("chevronLeft", "") + " Anterior</button>" +
    '<button class="btn" data-action="sim-flag">' + icon("flag", "") + (flagged ? " Remover marcação" : " Revisar depois") + "</button>" +
    '<div class="spacer"></div><button class="btn primary" data-action="sim-next">Próxima ' + icon("chevronRight", "") + "</button></div>" +
    '<div class="notice info mt-16">' + icon("info", "") + "<div>No modo oficial, a correção e o comentário aparecem somente ao finalizar. Não há desconto por erro.</div></div></section>" +
    '<aside class="card sim-side"><div class="card-head"><div><h3>Cartão-resposta</h3><p>Clique para navegar</p></div></div><div class="answer-sheet">' + sheet + '</div>' +
    '<div class="row mt-16" style="gap:6px"><button class="btn sm" data-action="sim-pause"' + (sim.mode === "estudo" ? "" : " disabled") + ">" + icon(sim.paused ? "play" : "pause", "") + (sim.paused ? "Retomar" : "Pausar") + "</button>" +
    '<button class="btn sm danger" data-action="sim-finish">Finalizar</button></div>' +
    '<p class="tiny muted mt-12">Rascunho salvo neste dispositivo. Se sair, retome por esta tela.</p></aside></div>' + pageFoot();
}

function fmtClock(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return (h ? pad2(h) + ":" : "") + pad2(m) + ":" + pad2(s);
}

function simResultView(sim) {
  const sc = scoreSim(sim);
  const status = sc.meta ? ["Meta 90% atingida", "green"] : sc.habilitado ? ["Habilitado", "blue"] : sc.zeroed.length ? ["Eliminado — área zerada", "red"] : ["Abaixo do corte", "warm"];

  const wrongHtml = wrong.length
    ? wrong.slice(0, 12).map((q) => {
      const a = (sim.answers || {})[q.id];

    }).join("")
    : '<p class="small muted">Nenhum erro. Use este resultado como diagnóstico, não como garantia: a prova real pode cobrar outros recortes.</p>';

  return pageHead("Resultado do simulado", fmtDateTime(sim.finishedAt || nowMs()) + " · " + (sim.mode === "oficial" ? "modo oficial" : "modo estudo"), '<button class="btn" data-action="sim-new">Novo simulado</button><button class="btn" data-action="sim-history">Histórico</button>') +
    '<div class="card"><div class="result-hero"><div class="score-circle" style="--pct:' + Math.min(100, sc.score) + '%"><div><b>' + sc.score.toFixed(1).replace(".", ",") + "</b><span>de 100</span></div></div>" +
    "<div style=\"flex:1;min-width:240px\"><div class=\"row-wrap\"><span class=\"badge " + status[1] + "\">" + status[0] + "</span><span class=\"badge outline\">" + sc.correct + "/40 acertos</span><span class=\"badge outline\">Corte 50,0</span>" + (sc.meta ? '<span class="badge lime">Meta 90%</span>' : "") + "</div>" +
    '<h2 style="font-size:22px;margin-top:10px">' + (sc.meta ? "Excelente desempenho — mantenha a revisão." : sc.habilitado ? "Você passaria no corte, mas ainda há lacunas." : sc.zeroed.length ? "A nota não basta: área zerada elimina." : "Ainda abaixo do corte mínimo.") + "</h2>" +
    '<p class="small muted mt-8">' + (sc.zeroed.length ? "Áreas zeradas: " + sc.zeroed.map((z) => AREA_BY_ID[z.area].name).join(", ") + ". Volte aos tópicos dessas áreas antes de outro simulado." : "Use o caderno de erros e os flashcards para transformar este resultado em próxima ação.") + "</p>" +
    '<div class="row mt-16"><a class="btn primary" href="#/erros">Abrir caderno de erros</a><a class="btn" href="#/flashcards">Revisar flashcards</a></div></div></div></div>' +
    '<div class="grid grid-2 mt-16"><div class="card"><div class="card-head"><div><h3>Desempenho por área</h3><p>Onde os pontos foram perdidos</p></div></div>' + byArea + "</div>" +
    '<div class="card"><div class="card-head"><div><h3>Questões para revisar</h3><p>Até 12 erros priorizados</p></div><a class="badge red" href="#/erros">' + wrong.length + " erros</a></div>" + wrongHtml + "</div></div>" +
    '<div class="notice warn mt-16">' + icon("alert", "") + "<div>Este resultado é uma medida do seu desempenho neste banco autoral, não uma previsão da prova. O simulado reutiliza itens em rodadas posteriores; o painel mostra o aviso de itens já vistos no histórico.</div></div>" + pageFoot();
}

<script>
/* ===== app-40-cases-errors-pareto-materials-config.js ===== */
/* ==========================================================================
   URO 90 — Casos, caderno de erros, Pareto, materiais e configuração
   ========================================================================== */

/* ------------------------------ Casos clínicos ------------------------------ */
function caseRecord(id) {
  const rec = state.cases[id];
  return rec && typeof rec === "object" ? rec : {};
}

function caseScore(id) {
  const rec = caseRecord(id);
  const c = CASE_BY_ID[id];
  if (!c) return { score: 0, max: 10, pct: 0, done: false };
  const max = total(c.rubric.map((r) => r.max)) || 10;
  const score = (rec.scores || []).reduce((a, b) => a + (Number(b) || 0), 0);
  return { score: +score.toFixed(1), max, pct: Math.round((score / max) * 100), done: !!(rec.answer && rec.answer.trim()) };
}

function viewCases() {
  if (!ui.caseId || !CASE_BY_ID[ui.caseId]) ui.caseId = CASES[0].id;
  const c = CASE_BY_ID[ui.caseId];
  const rec = caseRecord(c.id);
  const cs = caseScore(c.id);
  const answer = rec.answer || "";
  const scores = rec.scores || c.rubric.map(() => 0);
  const topic = TOPIC_BY_ID[c.topic] || TOPICS.find((t) => t.area === c.area);
  const area = AREA_BY_ID[c.area];
  const status = cs.score >= 9 ? ["Meta 90%", "lime"] : cs.score >= 5 ? ["Acima do corte", "green"] : cs.score > 0 ? ["Abaixo do corte", "warm"] : ["Não avaliado", "outline"];

  const list = CASES.map((item) => {
    const s = caseScore(item.id);
    const active = item.id === c.id ? " active" : "";
    return `<button class="case-pick${active}" data-action="case-select" data-case="${item.id}">

  const expected = ui.caseExpected

          <div class="case-prompt">${c.prompt}</div>
          <div class="mt-16"><div class="eyebrow">O que a resposta deve cobrir</div><ul class="task-list">${c.tasks.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
          <div class="mt-16"><label class="field"><span>Sua resposta</span><textarea class="textarea essay-editor" id="case-answer" data-case-answer="${c.id}" placeholder="Estruture: reconhecimento do problema → justificativa → conduta imediata → seguimento. Use terminologia precisa.">${esc(answer)}</textarea></label>
          <div class="essay-meta"><span id="case-chars">${answer.length} caracteres</span><span id="case-words">${answer.trim() ? answer.trim().split(/\s+/).length : 0} palavras</span><span>≈ ${Math.max(1, Math.ceil(answer.length / 65))} linhas de 65 caracteres</span><span>Meta de extensão: ~30 linhas</span></div>
          <div class="row mt-16"><button class="btn primary" data-action="case-save">${icon("save", "")} Salvar resposta</button><button class="btn" data-action="case-expected">${ui.caseExpected ? "Ocultar espelho" : "Ver espelho de resposta"}</button><div class="spacer"></div><button class="btn ghost" data-action="case-clear">${icon("trash", "")} Limpar</button></div></div></div>
        <div class="card"><div class="card-head"><div><h3>Rubrica de autoavaliação</h3><p>Marque com honestidade o que sua resposta comprovou</p></div><span class="badge ${cs.score >= 9 ? "lime" : cs.score >= 5 ? "green" : "outline"}">${cs.score.toFixed(1).replace(".", ",")} / 10</span></div>${rubric}
          <div class="row mt-16" style="justify-content:space-between"><span class="small muted">Corte 5,0 · meta 9,0</span><b id="case-score-total">${cs.score.toFixed(1).replace(".", ",")} / 10</b></div>
          <div class="progress mt-8 ${cs.score >= 9 ? "green" : ""}"><i style="width:${Math.min(100, cs.pct)}%"></i></div>
          <p class="tiny muted mt-12">A rubrica é um guia de estudo. A correção real depende do professor, do comando da questão e da fundamentação. Não há promessa de nota.</p></div>

function viewErrors() {
  const all = errorQuestions();

  all.forEach((q) => { byArea[q.area] = (byArea[q.area] || 0) + 1; });
  const chips = AREAS.filter((a) => byArea[a.id]).map((a) => `<span class="chip">${a.short} <b>${byArea[a.id]}</b></span>`).join("");

  const rows = list.map((q) => {
    const last = lastAttempt(q.id);
    const topic = TOPIC_BY_ID[q.topicId];
    const area = AREA_BY_ID[q.area];

    return `<div class="card error-card">
      <div class="card-head"><div><div class="lesson-meta-line"><span class="badge outline">${area.short}</span><span class="badge ${TEMP_CLASS[topic.temp]}">${TEMP_LABEL[topic.temp]}</span><span class="badge red">${misses} erro${misses > 1 ? "s" : ""}</span><span class="tiny muted">${last ? fmtDateTime(last.at) : ""}</span></div><h3 style="margin-top:6px">${esc(topic.title)}</h3></div><button class="btn sm" data-action="error-retest" data-q="${q.id}">${icon("rotate", "")} Refazer</button></div>

    pageFoot();

/* ------------------------------ Pareto 90 ------------------------------ */
function inferredPriority(t) {
  const temp = { hot: 1, warm: 0.62, cold: 0.32 }[t.temp] || 0.5;
  const cost = Math.max(t.minutes / 60, 0.25);
  return (AREA_BY_ID[t.area].weight * temp * 100) / cost;
}

function paretoRanking() {
  return TOPICS.map((t) => {
    const personal = personalPriority(t);
    const score = personal == null ? inferredPriority(t) : personal;
    return { topic: t, personal, score };
  }).sort((a, b) => b.score - a.score);
}

function viewPareto() {
  const ranking = paretoRanking();
  const maxScore = Math.max.apply(null, ranking.map((r) => r.score)) || 1;
  const st = globalStats();
  const diagnosed = TOPICS.filter((t) => topicStats(t.id).attempts > 0).length;

  const macro = AREAS.map((a) => `<span style="width:${a.weight}%;background:${a.color}" title="${esc(a.name)}: ${a.weight}%">${a.short}</span>`).join("");
  const legend = AREAS.map((a) => `<span><i style="background:${a.color}"></i>${a.short} · ${a.weight}%</span>`).join("");

  const rows = ranking.map((r, i) => {
    const t = r.topic;
    const area = AREA_BY_ID[t.area];
    const ts = topicStats(t.id);
    const done = lessonDone(t.id);
    const acc = ts.accuracy == null ? null : Math.round(ts.accuracy * 100);
    return `<div class="topic-row">
      <div class="topic-rank">${String(i + 1).padStart(2, "0")}</div>
      <div style="min-width:0"><div class="topic-title">${esc(t.title)}</div><div class="topic-sub">${area.short} · ${t.minutes} min · ${esc(t.subtopics[0] || "")}</div></div>
      <div><span class="badge ${TEMP_CLASS[t.temp]}">${TEMP_LABEL[t.temp]}</span></div>
      <div class="tiny muted">${done ? '<span class="badge green">Aula ok</span>' : "Pendente"}<div class="tiny muted mt-8">${acc == null ? "sem diagnóstico" : acc + "% acerto"}</div></div>
      <div><div class="priority-score">${Math.round((r.score / maxScore) * 100)}/100</div><div class="meter"><i style="width:${Math.round((r.score / maxScore) * 100)}%"></i></div><button class="btn sm mt-8" data-action="open-lesson" data-topic="${t.id}">Abrir</button></div>
    </div>`;
  }).join("");

  const personal = ranking.filter((r) => r.personal != null).slice(0, 8);
  const personalHtml = personal.length
    ? personal.map((r) => {
      const ts = topicStats(r.topic.id);
      return `<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><div style="min-width:0"><div class="small" style="font-weight:650">${esc(r.topic.title)}</div><div class="tiny muted">${Math.round(ts.accuracy * 100)}% em ${ts.attempts} tentativas</div></div><button class="btn sm" data-action="open-lesson" data-topic="${r.topic.id}">Reforçar</button></div>`;
    }).join("")
    : `<div class="empty" style="padding:24px"><div class="ico">${icon("target", "")}</div><h3>Sem ranking pessoal ainda</h3><p>Responda questões para o sistema calcular sua lacuna por tópico. Até lá, o ranking usa prioridade pedagógica declarada — não desempenho inventado.</p><a class="btn primary mt-12" href="#/questoes">Fazer diagnóstico</a></div>`;

  const micro = MICRO.map((m) => {
    const t = TOPIC_BY_ID[m.topicId] || {};
    return `<div class="micro-row"><div class="micro-roi">ROI ${m.roi}</div><div style="min-width:0"><div class="small" style="font-weight:650;line-height:1.5">${esc(m.rule)}</div><div class="tiny muted mt-8">${esc(t.title || "")} · ${m.minutes} min · ${esc(m.source)}</div></div><button class="btn sm" data-action="open-lesson" data-topic="${m.topicId}">Ver aula</button></div>`;
  }).join("");

  return pageHead("Pareto 90", "Macro (áreas), meso (28 tópicos) e micro (18 regras). O ranking combina peso declarado, temperatura e seu desempenho real quando existe.", `<span class="badge blue">${diagnosed}/${TOPICS.length} tópicos diagnosticados</span><button class="btn sm" data-action="export-pareto">${icon("download", "")} CSV</button>`) +
    `<div class="grid grid-3 mt-16">
      <div class="card"><div class="card-head"><div><h3>Macro</h3><p>Distribuição do simulado</p></div><span class="badge blue">40 itens</span></div><div class="macro-bar">${macro}</div><div class="legend">${legend}</div><p class="tiny muted mt-12">O peso é a distribuição assumida do painel. Não é estatística oficial da sua prova — é priorização explícita e editável no método.</p></div>
      <div class="card"><div class="card-head"><div><h3>Seu preparo</h3><p>Dados reais deste dispositivo</p></div></div>
      <div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span class="small">Acurácia em questões</span><b>${st.attempts ? Math.round(st.accuracy * 100) + "%" : "—"}</b></div>
      <div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span class="small">Tentativas registradas</span><b>${st.attempts}</b></div>
      <div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span class="small">Cobertura de aulas</span><b>${coveragePct()}%</b></div>
      <div class="row" style="justify-content:space-between;padding:7px 0"><span class="small">Erros pendentes</span><b>${errorQuestions().length}</b></div>
      <div class="notice info mt-12">${icon("info", "")}<div>Prioridade pessoal = peso da área × lacuna ÷ custo em horas. Sem tentativas, não há lacuna mensurável: usamos a inferência pedagógica e dizemos isso.</div></div></div>
      <div class="card"><div class="card-head"><div><h3>Regra dos 90%</h3><p>O que priorizar em 1 dia</p></div><span class="badge lime">meta</span></div>
      <p class="small" style="line-height:1.65">Em um dia, você não cobre o edital inteiro. Cobre o que mais rende: <b>emergências com conduta objetiva</b>, <b>oncologia de próstata/bexiga/rim</b>, <b>litíase obstrutiva</b> e <b>infecção com sinais de gravidade</b>.</p>
      <div class="callout"><strong>Regra prática:</strong> 60% do tempo em tópicos quentes, 30% em mornos com erro registrado, 10% em revisão de flashcards e caderno. Tópicos frios ficam para consulta, não para aula longa na véspera.</div>
      <p class="tiny muted mt-12">${esc(META.evidenceNote)}</p></div></div>` +
    `<div class="grid mt-16" style="grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr)"><div class="card"><div class="card-head"><div><h3>Ranking meso — 28 tópicos</h3><p>Ordenado por retorno estimado por hora</p></div><span class="badge outline">${TOPICS.length} tópicos</span></div>${rows}</div><div class="stack"><div class="card"><div class="card-head"><div><h3>Ranking pessoal</h3><p>Onde sua lacuna dói mais</p></div><span class="badge ${personal.length ? "warm" : "outline"}">${personal.length}</span></div>${personalHtml}</div><div class="card"><div class="card-head"><div><h3>Micro — 18 regras</h3><p>Alta frequência, resposta curta</p></div></div><div class="micro-list">${micro}</div></div></div></div>` +
    pageFoot();
}

/* ------------------------------ Materiais & prova ------------------------------ */
function materialMatches(m) {
  if (ui.materialType !== "all" && m.type !== ui.materialType) return false;
  const term = ui.materialSearch.trim().toLowerCase();
  if (!term) return true;
  return (m.title + " " + m.org + " " + m.note + " " + m.tags.join(" ")).toLowerCase().includes(term);
}

function viewMaterials() {
  const types = Array.from(new Set(MATERIALS.map((m) => m.type))).sort();
